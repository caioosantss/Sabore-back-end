spring.application.name=receitas

spring.datasource.url=${MYSQLPROD_URL}
spring.datasource.password=${MYSQLPROD_PASSWORD}
spring.datasource.username=${MYSQLUSERPROD_USER}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Railway injeta a porta em tempo de execucao; 8080 e o fallback local.
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Aceita curinga: https://*.vercel.app cobre producao e as URLs de preview.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sabore-gamma.vercel.app/

# --- Upload de imagens (Supabase Storage) -------------------------------
# Crie um bucket PUBLICO no Supabase e preencha as variaveis abaixo.
# A service_role key fica em Settings > API. Nunca exponha ela no front.
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.supabase.bucket=${SUPABASE_BUCKET:receitas}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Primeiro administrador --------------------------------------------
# Criado na subida da aplicacao se o e-mail ainda nao existir.
app.admin.name=${ADMIN_NAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Devolve 404 tratado em vez da pagina de erro padrao do Spring.
spring.web.resources.add-mappings=false
